quiz(){if(!qz)return `<h2>Latihan & Kuis</h2><p class="sub">Pilih jenis kuis (pilihan ganda, nilai otomatis, dengan pembahasan).</p><div class="grid"><button class="card fc" data-q="vocab"><span>📘</span>Kuis Kosakata</button><button class="card fc" data-q="kanji"><span>漢</span>Kuis Kanji</button><button class='card fc' data-q='grammar'><span>文</span>Kuis Grammar</button><button class='card fc' data-q='umum'><span>🗂️</span>Kuis Kosakata Tema</button><button class='card fc' data-q='kerja'><span>💼</span>Kuis Dunia Kerja</button><button class='card fc' data-q='etika'><span>🙇</span>Kuis Etika</button><button class='card fc' data-q='lanjut'><span>🎓</span>Kuis N3–N1</button><button class='card fc' data-q='tes'><span>🏆</span>Tes Evaluasi (campuran)</button></div>`;
if(qz.i>=qz.qs.length){const n=Math.round(qz.s/qz.qs.length*100);return `<div class="card hero">${panda(90)}<h2>Nilai: ${n}</h2><p>Benar ${qz.s} dari ${qz.qs.length}. ${n>=80?'Hebat sekali! 🎉':n>=50?'Bagus, terus berlatih!':'Jangan menyerah, ulangi materinya ya!'}</p><button class="btn" data-q="${qz.t}">Ulangi</button><button class="btn o" data-q="">Menu Kuis</button></div>`}
const q=qz.qs[qz.i];return `<div class="row"><b>Soal ${qz.i+1}/${qz.qs.length}</b><span>Skor ${qz.s}</span></div><div class="bar"><div style="width:${qz.i/qz.qs.length*100}%"></div></div><div class="card" style="margin-top:12px"><div class="row"><div class="jp" style="font-size:20px">${q.q}</div>${q.a?sp(q.a):''}</div>${q.o.map((o,j)=>`<button class="opt ${qz.p!=null?(j===q.c?'ok':j===qz.p?'no':''):''}" data-o="${j}" ${qz.p!=null?'disabled':''}>${o}</button>`).join('')}${qz.p!=null?`<div class="note"><b>${qz.p===q.c?'✅ Benar!':'❌ Kurang tepat.'}</b> Pembahasan: ${q.e}</div><button class="btn" data-n="1" style="margin-top:8px">${qz.i+1>=qz.qs.length?'Lihat Nilai':'Lanjut'}</button>`:''}</div>`},
progress(){const p=pct(),t=st.d[today()]||0,g=Math.min(100,Math.round(t/st.goal*100));const c=(pre,n)=>{let d=0;for(let i=0;i<n;i++)if(st.l[pre+i])d++;return d+'/'+n};
const kn=[0,1].reduce((s,t)=>s+KR.filter((_,i)=>st.l['k'+t+i]).length,0);
return `<h2>Progress Belajar</h2><div class="card"><div class="row"><b>Total kemajuan</b><b>${p}%</b></div><div class="bar"><div style="width:${p}%"></div></div></div>
<div class="card"><div class="row"><b>Target harian</b><b>${t}/${st.goal} aktivitas</b></div><div class="bar"><div style="width:${g}%"></div></div><p class="rm">${t>=st.goal?'🎉 Target hari ini tercapai!':'Tandai materi atau jawab soal kuis untuk menambah.'}</p><label>Ubah target: <select id="gl">${[5,10,15,20,30].map(n=>`<option ${n===st.goal?'selected':''}>${n}</option>`).join('')}</select></label></div>
<div class="card"><b>Rincian</b><p>Huruf kana (baris): ${kn}/30<br>Kosakata N5: ${c('a',N5.length)}<br>Kosakata N4: ${c('b',N4.length)}<br>Kanji: ${c('j',KJ.length)}<br>Grammar: ${c('g',GR.length)}<br>Etika Jepang: ${c('e',MN.length)}<br>Kosakata tema: ${c('v',VC.length)}<br>Kosakata kerja: ${c('w',VK.length)}<br>Kosakata N3–N1: ${c('x',VL.length)}</p><button class="btn o" data-reset="1">Reset progres</button></div>`}};
function pct(){const a=items();return Math.round(a.filter(i=>st.l[i]).length/a.length*100)}
function sh(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function pool(t){const m=a=>a.map(w=>({k:w[1],f:w[0],r:w[2],m:w[3]}));if(t==='vocab')return m([...N5,...N4]);if(t==='kanji')return KJ.map(k=>({k:k[0],f:k[4],r:k[4],m:k[1],x:`Onyomi ${k[2]}, kunyomi ${k[3]}.`}));if(t==='umum')return m(VC);if(t==='lanjut')return m(VL);if(t==='kerja')return m(VK);return MN.map(x=>({k:x[2],f:x[2],r:x[3],m:x[4],x:'Situasi: '+x[5]}))}
function gen(t,n){if(t==='grammar')return sh(GQ).slice(0,n).map(g=>({q:g[0],o:g[1],c:g[2],e:g[3]}));const P=pool(t);return sh(P).slice(0,n).map(w=>{const o=sh([w.m,...sh(P.filter(z=>z.m!==w.m)).slice(0,3).map(z=>z.m)]);return{q:`Apa arti 「${w.k}」?`,a:w.f,o,c:o.indexOf(w.m),e:`${w.k} (${w.r}) berarti “${w.m}”. ${w.x||''}`}})}
function mk(t){qz={t,qs:t==='tes'?sh(['vocab','kanji','umum','kerja','etika','grammar'].flatMap(x=>gen(x,2))):gen(t,8),i:0,s:0,p:null}}
function mkOld(t){let qs=[];if(t==='grammar')qs=sh(GQ).map(g=>({q:g[0],o:g[1],c:g[2],e:g[3]}));
else{const P=t==='vocab'?[...N5,...N4].map(w=>({k:w[1],f:w[0],r:w[2],m:w[3]})):KJ.map(k=>({k:k[0],f:k[4],r:k[4],m:k[1],x:`Onyomi ${k[2]}, kunyomi ${k[3]}.`}));
qs=sh(P).slice(0,8).map(w=>{const w3=sh(P.filter(z=>z.m!==w.m)).slice(0,3).map(z=>z.m),o=sh([w.m,...w3]);return {q:`Apa arti 「${w.k}」${t==='vocab'?'('+w.f+')':''}?`,a:t==='vocab'?w.f:w.f,o,c:o.indexOf(w.m),e:`${w.k} (${w.r}) berarti “${w.m}”. ${w.x||''}`}})}
qz={t,qs,i:0,s:0,p:null}}
// ---------- Router & events ----------
function render(){const h=(location.hash||'#home').slice(1),pg=V[h]?h:'home';
$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===pg?'on':''}">${n[1]}</a>`).join('');
$('#app').innerHTML=V[pg]();if(!window._k||window._pg!==pg){window.scrollTo(0,0)}window._pg=pg;window._k=1;
const a=$('#nav a.on');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
addEventListener('hashchange',()=>{qz=null;render()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-s],[data-l],[data-kt],[data-q],[data-o],[data-n],[data-reset],[data-fc]');if(!t)return;const d=t.dataset;
if(d.fc!==undefined){const f=d.fc.split('|');fcat[f[0]]=f[1];return render()}if(d.s)return speak(d.s);
if(d.l!==undefined){const y=window.scrollY;if(st.l[d.l])delete st.l[d.l];else{st.l[d.l]=1;bump()}save();render();window.scrollTo(0,y);return}
if(d.kt!==undefined){kt=+d.kt;return render()}
if(d.q!==undefined){if(d.q)mk(d.q);else qz=null;return render()}
if(d.o!==undefined&&qz.p==null){qz.p=+d.o;if(qz.p===qz.qs[qz.i].c)qz.s++;bump();return render()}
if(d.n){qz.i++;qz.p=null;render();return window.scrollTo(0,0)}
if(d.reset&&confirm('Hapus semua progres belajar?')){st={l:{},d:{},goal:st.goal};save();render()}});
document.addEventListener('change',e=>{if(e.target.id==='gl'){st.goal=+e.target.value;save();render()}});
render();
</script></body></html>
